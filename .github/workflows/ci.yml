name: Integracao Continua - Solver de Evaporadores

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Repositorio
      uses: actions/checkout@v4

    - name: Instalar Dependencias (GCC, CMake, Ninja)
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc cmake ninja-build

    - name: Configurar e Compilar (CMake + Ninja)
      run: |
        cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release
        cmake --build build

    - name: Executar Suite Completa de Testes
      run: |
        ./build/evap_tests

    - name: Validar Execucao do Benchmark na CLI
      run: |
        ./build/evap_cli --benchmark

    - name: Validar Saida JSON na CLI
      run: |
        ./build/evap_cli -n 3 --json

  build-wasm:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - name: Checkout do Repositorio
      uses: actions/checkout@v4

    - name: Configurar Emscripten SDK
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: 3.1.60

    - name: Compilar Núcleo C para WebAssembly
      run: |
        emcc -O3 -s WASM=1 \
          -s EXPORTED_RUNTIME_METHODS="['ccall','cwrap','UTF8ToString']" \
          -s EXPORTED_FUNCTIONS="['_wasm_solve_direct','_wasm_get_steam_rate','_wasm_get_vapor_economy','_wasm_get_area_per_effect','_wasm_get_total_area','_wasm_get_total_dt','_wasm_get_total_bpe','_wasm_get_outer_iter','_wasm_get_inner_iter','_wasm_get_effect_vapor','_wasm_get_effect_liquid','_wasm_get_effect_conc','_wasm_get_effect_temp','_wasm_get_effect_sat_temp','_wasm_get_effect_pressure','_wasm_get_effect_bpe','_wasm_get_effect_delta_t','_wasm_get_effect_area','_wasm_get_effect_heat_duty','_wasm_get_last_error','_wasm_simulate_json','_malloc','_free']" \
          -s MODULARIZE=1 \
          -s EXPORT_NAME="createEvapModule" \
          -s ALLOW_MEMORY_GROWTH=1 \
          -Iinclude -Isrc \
          src/wasm/wasm_api.c \
          src/core/solver.c \
          src/core/thermodynamics.c \
          src/core/validation.c \
          src/core/types.c \
          -o web/js/evap_solver.js

    - name: Publicar Artefatos do Front-end (GitHub Pages)
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v3
      with:
        path: web/

